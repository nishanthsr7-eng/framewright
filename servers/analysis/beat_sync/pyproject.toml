[project]
name = "beat-sync-mcp"
version = "0.1.0"
description = "检测音乐节拍并自动将多个视频片段按节拍剪切拼接成卡点视频"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["framewright-core", "mcp[cli]>=1.6.0", "librosa>=0.10.1,<0.11", "numpy>=1.23,<2.0", "soundfile>=0.12.1"]

[project.scripts]
beat-sync-mcp = "beat_sync_mcp.server:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beat_sync_mcp"]

[tool.uv.sources]
framewright-core = { workspace = true }
