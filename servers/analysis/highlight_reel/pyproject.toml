[project]
name = "highlight-reel-mcp"
version = "0.1.0"
description = "基于音频能量/冲击强度自动挑选视频中最精彩的片段，拼接生成集锦/预告片"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["framewright-core", 
    "mcp[cli]>=1.6.0",
    "librosa>=0.10.1,<0.11",
    "numpy>=1.23,<2.0",
    "soundfile>=0.12.1"
]

[project.scripts]
highlight-reel-mcp = "highlight_reel_mcp.server:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/highlight_reel_mcp"]

[tool.uv.sources]
framewright-core = { workspace = true }
