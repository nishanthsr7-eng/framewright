[project]
name = "scene-detector-mcp"
version = "0.1.0"
description = "使用 PySceneDetect 检测视频中的镜头/场景切换点，并可将视频按镜头拆分为多个片段"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["framewright-core", 
    "mcp[cli]>=1.6.0",
    "scenedetect>=0.6.4"
]

[project.scripts]
scene-detector-mcp = "scene_detector_mcp.server:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scene_detector_mcp"]

[tool.uv.sources]
framewright-core = { workspace = true }
