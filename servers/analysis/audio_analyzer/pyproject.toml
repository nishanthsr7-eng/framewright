[project]
name = "audio-analyzer-mcp"
version = "0.1.0"
description = "分析音频/视频中的节奏(BPM/节拍)、转录文字、冲击/瞬态时刻以及频谱等特征"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["framewright-core", 
    "mcp[cli]>=1.6.0",
    "librosa>=0.10.1,<0.11",
    "faster-whisper>=1.0.0,<2.0",
    "av>=11,<18",  # PyAV 18+ dropped open(metadata_errors=...), which faster-whisper passes
    "numpy>=1.23,<2.0",
    "soundfile>=0.12.1",
    "onnxruntime>=1.17.0,<1.20"
]

[project.scripts]
audio-analyzer-mcp = "audio_analyzer_mcp.server:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_analyzer_mcp"]

[tool.uv.sources]
framewright-core = { workspace = true }
