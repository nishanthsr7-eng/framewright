[project]
name = "framewright-core"
version = "0.1.0"
description = "Shared helpers for Framewright MCP servers: paths, ffmpeg, tool errors, logging"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=1.6.0,<2"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/framewright_core"]
