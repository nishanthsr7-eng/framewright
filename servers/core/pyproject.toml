[project]
name = "framewright-core"
version = "0.1.0"
description = "Shared helpers for Framewright MCP servers: paths, ffmpeg, tool errors, logging"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=1.6.0,<2"]

[tool.poetry]
packages = [{include = "framewright_core", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
