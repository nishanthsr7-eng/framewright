[project]
name = "frame-extractor-mcp"
version = "0.2.0"
description = "Frame extraction, clipping, concat and Real-ESRGAN upscaling via ffmpeg (based on video-creator/ffmpeg-mcp, MIT)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["framewright-core", "mcp[cli]>=1.6.0"]

[project.scripts]
frame-extractor-mcp = "ffmpeg_mcp.server:main"

[tool.poetry]
packages = [{include = "ffmpeg_mcp", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.uv.sources]
framewright-core = { workspace = true }
