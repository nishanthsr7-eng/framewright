[project]
name = "chroma-key-mcp"
version = "0.1.0"
description = "绿幕/蓝幕抠像与背景替换"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["framewright-core", "mcp[cli]>=1.6.0"]

[project.scripts]
chroma-key-mcp = "chroma_key_mcp.server:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chroma_key_mcp"]

[tool.uv.sources]
framewright-core = { workspace = true }
