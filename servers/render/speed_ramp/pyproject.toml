[project]
name = "speed-ramp-mcp"
version = "0.1.0"
description = "变速处理与多段变速(速度坡度)剪辑，支持运动补偿慢动作"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=1.6.0"]

[tool.poetry]
packages = [{include = "speed_ramp_mcp", from = "src"}]

[project.scripts]
speed-ramp-mcp = "speed_ramp_mcp.server:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
