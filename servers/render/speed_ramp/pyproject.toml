[project]
name = "speed-ramp-mcp"
version = "0.1.0"
description = "变速处理与多段变速(速度坡度)剪辑，支持运动补偿慢动作"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["framewright-core", "mcp[cli]>=1.6.0"]

[project.scripts]
speed-ramp-mcp = "speed_ramp_mcp.server:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speed_ramp_mcp"]

[tool.uv.sources]
framewright-core = { workspace = true }
