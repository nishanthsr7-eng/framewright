[project]
name = "stabilization-mcp"
version = "0.1.0"
description = "使用 vidstab 对手持/抖动视频进行两遍稳像处理"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["framewright-core", "mcp[cli]>=1.6.0"]

[project.scripts]
stabilization-mcp = "stabilization_mcp.server:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stabilization_mcp"]

[tool.uv.sources]
framewright-core = { workspace = true }
