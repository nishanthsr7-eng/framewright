[project]
name = "color-match-mcp"
version = "0.1.0"
description = "通过采样帧的颜色统计(均值/标准差)分析视频色彩风格，并将一个视频的色彩匹配到另一个视频/参考图"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["framewright-core", 
    "mcp[cli]>=1.6.0",
    "numpy>=1.24",
    "Pillow>=10.0",
]

[project.scripts]
color-match-mcp = "color_match_mcp.server:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/color_match_mcp"]

[tool.uv.sources]
framewright-core = { workspace = true }
