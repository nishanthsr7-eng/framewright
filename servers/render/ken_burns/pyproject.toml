[project]
name = "ken-burns-mcp"
version = "0.1.0"
description = "为静态图片生成 Ken Burns 缓慢缩放/平移动态效果视频"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["framewright-core", "mcp[cli]>=1.6.0"]

[project.scripts]
ken-burns-mcp = "ken_burns_mcp.server:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ken_burns_mcp"]

[tool.uv.sources]
framewright-core = { workspace = true }
