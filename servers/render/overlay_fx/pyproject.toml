[project]
name = "overlay-fx-mcp"
version = "0.1.0"
description = "胶片颗粒、暗角、色差、光晕(light leak)等电影感叠加特效"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["framewright-core", "mcp[cli]>=1.6.0"]

include = ["src/overlay_fx_mcp/assets/*.png"]

[project.scripts]
overlay-fx-mcp = "overlay_fx_mcp.server:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/overlay_fx_mcp"]

[tool.uv.sources]
framewright-core = { workspace = true }
