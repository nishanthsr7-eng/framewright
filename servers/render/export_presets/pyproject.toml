[project]
name = "export-presets-mcp"
version = "0.1.0"
description = "按各社交平台(YouTube/TikTok/Instagram/Twitter等)的推荐分辨率、码率和宽高比一键导出视频"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["framewright-core", "mcp[cli]>=1.6.0"]

[project.scripts]
export-presets-mcp = "export_presets_mcp.server:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/export_presets_mcp"]

[tool.uv.sources]
framewright-core = { workspace = true }
