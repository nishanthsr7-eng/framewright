[project]
name = "audio-mastering-mcp"
version = "0.1.0"
description = "音频后期处理: 响度归一化(loudnorm)、降噪(afftdn)、背景音乐混音与自动闪避(sidechain ducking)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["framewright-core", "mcp[cli]>=1.6.0"]

[project.scripts]
audio-mastering-mcp = "audio_mastering_mcp.server:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_mastering_mcp"]

[tool.uv.sources]
framewright-core = { workspace = true }
