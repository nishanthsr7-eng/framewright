[project]
name = "lut-grading-mcp"
version = "0.1.0"
description = "应用电影级 3D LUT 色彩分级预设(或自定义 .cube 文件)到视频"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=1.6.0"]

[tool.poetry]
packages = [{include = "lut_grading_mcp", from = "src"}]
include = ["src/lut_grading_mcp/luts/*.cube"]

[project.scripts]
lut-grading-mcp = "lut_grading_mcp.server:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
