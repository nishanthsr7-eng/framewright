[project]
name = "lut-grading-mcp"
version = "0.1.0"
description = "应用电影级 3D LUT 色彩分级预设(或自定义 .cube 文件)到视频"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["framewright-core", "mcp[cli]>=1.6.0"]

include = ["src/lut_grading_mcp/luts/*.cube"]

[project.scripts]
lut-grading-mcp = "lut_grading_mcp.server:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lut_grading_mcp"]

[tool.uv.sources]
framewright-core = { workspace = true }
