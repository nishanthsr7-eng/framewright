[project]
name = "framewright"
version = "0.1.0"
description = "AI-assisted video editing over MCP"
requires-python = ">=3.10"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["servers/core", "servers/analysis/*", "servers/assets/*", "servers/render/*"]

[tool.uv.sources]
framewright-core = { workspace = true }
beat-sync-mcp = { workspace = true }
effects-mcp = { workspace = true }
timeline-project-mcp = { workspace = true }
scene-detector-mcp = { workspace = true }

[dependency-groups]
dev = ["ruff>=0.6", "pyright>=1.1.380", "pytest>=8", "pre-commit>=3.8"]
# What tests/ imports: core plus the light servers (no torch/onnx/whisper).
test = ["pytest>=8", "framewright-core", "beat-sync-mcp", "effects-mcp", "timeline-project-mcp"]
# What the CI eval job runs (evals/eval_beat_sync.py, evals/eval_scenes.py).
eval = ["beat-sync-mcp", "scene-detector-mcp"]
# evals/eval_agent.py (needs LLM endpoints, not run in CI).
agent = ["beat-sync-mcp", "luaparser>=3.2"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["models", "input", "output", "resolve/templates"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Style-only rules the existing code base does not follow yet.
ignore = ["E501", "E702", "E731", "E741", "W293", "B007"]

[tool.pyright]
include = ["servers", "resolve/bridge", "evals", "scripts"]
exclude = ["**/.venv", "**/__pycache__", "models", "output", "servers/assets/frame_extractor"]  # vendored
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingModuleSource = "none"

[tool.pytest.ini_options]
testpaths = ["resolve/bridge", "servers", "tests"]
addopts = "-q"
markers = ["ffmpeg: needs ffmpeg/ffprobe on PATH (tiny lavfi inputs)"]
